<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyến đi của tôi - Tài xế</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-truck-fast me-2"></i> Chuyến Đi Được Phân Công</h2>
            <a href="dashboard.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại Dashboard</a>
        </div>

        <!-- Danh sách chuyến của tài xế -->
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">Danh sách chuyến của bạn</h5>
            </div>
            <div class="card-body table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Lộ trình</th>
                            <th>Xe vận chuyển</th>
                            <th>Thời gian</th>
                            <th>Trạng thái</th>
                            <th>Thao tác cập nhật</th>
                        </tr>
                    </thead>
                    <tbody id="driverTripTableBody">
                        <!-- Dữ liệu được load động qua JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Nhúng file js xử lý trips -->
    <script src="../js/trips.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const trips = await loadTrips(); // Backend sẽ tự động trả về đúng các chuyến của tài xế đang đăng nhập
            const tbody = document.getElementById('driverTripTableBody');
            tbody.innerHTML = '';

            if (trips.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Bạn chưa được phân công chuyến vận chuyển nào.</td></tr>`;
                return;
            }

            trips.forEach(trip => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${trip.id}</td>
                        <td><strong>${trip.start_location}</strong> ➔ <strong>${trip.end_location}</strong></td>
                        <td>${trip.license_plate || 'N/A'} (${trip.vehicle_type || ''})</td>
                        <td>${trip.start_time || 'N/A'}</td>
                        <td><span class="badge bg-warning text-dark">${trip.status}</span></td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="changeStatus(${trip.id}, 'IN_PROGRESS')">Đang chạy</button>
                            <button class="btn btn-sm btn-success" onclick="changeStatus(${trip.id}, 'COMPLETED')">Hoàn thành</button>
                        </td>
                    </tr>
                `;
            });
        });

        async function changeStatus(tripId, newStatus) {
            if (!confirm(`Bạn có chắc muốn đổi trạng thái chuyến #${tripId} thành ${newStatus}?`)) return;
            
            const res = await updateTripStatus(tripId, newStatus);
            if (res.success) {
                alert(res.message);
                location.reload();
            } else {
                alert('Lỗi: ' + res.message);
            }
        }
    </script>
</body>
</html>
