<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng vận chuyển - Tài xế</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background-color: #f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .driver-navbar { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 14px 0; }
        .brand { display: flex; align-items: center; gap: 10px; color: #1f2937; text-decoration: none; font-size: 20px; font-weight: 700; }
        .brand-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #059669; color: white; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: #ecfdf5; color: #059669; display: flex; align-items: center; justify-content: center; }
        .table-responsive { max-height: 70vh; overflow-y: auto; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="driver-navbar mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="dashboard.html" class="brand">
                <span class="brand-icon"><i class="fa-solid fa-steering-wheel"></i></span>
                Cổng Tài Xế
            </a>
            <div class="user-info">
                <div class="text-end d-none d-md-block">
                    <div class="fw-bold" style="font-size: 14px;" id="driverName">Đang tải...</div>
                    <div class="text-muted" style="font-size: 12px;">Tài xế</div>
                </div>
                <div class="user-avatar"><i class="fa-solid fa-user-tie"></i></div>
                <button class="btn btn-light btn-sm ms-3 text-secondary" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Thoát</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container py-2">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-box-open me-2 text-warning"></i> Chi Tiết Hàng Hóa Vận Chuyển</h2>
            <a href="dashboard.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại Dashboard</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 text-secondary">Hàng hóa thuộc các chuyến đi của bạn</h5>
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Thuộc chuyến</th>
                            <th>Mã Đơn Hàng</th>
                            <th>Điểm lấy hàng</th>
                            <th>Điểm giao hàng</th>
                            <th>Khối lượng</th>
                            <th>Trạng thái đơn</th>
                        </tr>
                    </thead>
                    <tbody id="driverOrderTableBody">
                        <tr><td colspan="6" class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = new URL('../../backend/public/index.php', window.location.href);

        // 1. Kiểm tra Session
        async function checkDriverSession() {
            API_URL.searchParams.set('route', '/api/me');
            try {
                const response = await fetch(API_URL.href, { method: 'GET', credentials: 'same-origin' });
                if (response.status === 401) { window.location.href = '../customer/login.html'; return; }
                
                const result = await response.json();
                if (!result.success || result.data.role !== 'DRIVER') {
                    alert('Lỗi truy cập: Bạn không có quyền Tài xế!');
                    window.location.href = '../customer/login.html';
                    return;
                }
                document.getElementById('driverName').textContent = result.data.full_name || result.data.username;
            } catch (error) { console.error("Lỗi xác thực:", error); }
        }

        // 2. Lấy danh sách đơn hàng của Tài xế
        async function loadDriverOrders() {
            // Tạm thời gọi API endpoint (cần đảm bảo Backend có viết route này)
            // Nếu backend chưa có, đoạn này sẽ catch lỗi gọn gàng và báo không có dữ liệu.
            API_URL.searchParams.set('route', '/api/customer/orders'); // Dùng tạm API orders hoặc API riêng của driver
            try {
                const response = await fetch(API_URL.href, { method: 'GET', credentials: 'same-origin' });
                const tbody = document.getElementById('driverOrderTableBody');
                
                if (!response.ok) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Hệ thống đang cập nhật tính năng xem đơn hàng.</td></tr>`;
                    return;
                }

                const result = await response.json();
                const orders = result.data || [];

                tbody.innerHTML = '';
                if (orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Chưa có đơn hàng nào cần giao.</td></tr>`;
                    return;
                }

                orders.forEach(order => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-3"><span class="badge bg-secondary">#Chuyến (Chờ map)</span></td>
                            <td class="fw-bold">${order.order_code}</td>
                            <td>${order.pickup_address}</td>
                            <td>${order.delivery_address}</td>
                            <td>${order.total_weight} kg</td>
                            <td><span class="badge border border-primary text-primary">${order.status}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                document.getElementById('driverOrderTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Lỗi kết nối máy chủ.</td></tr>`;
            }
        }

        // 3. Đăng xuất
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            API_URL.searchParams.set('route', '/api/logout');
            await fetch(API_URL.href, { method: 'POST', credentials: 'same-origin' });
            sessionStorage.clear();
            window.location.href = '../customer/login.html';
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await checkDriverSession();
            await loadDriverOrders();
        });
    </script>
</body>
</html>
