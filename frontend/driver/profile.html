ption value="inactive">Chưa sẵn sàng</option></select></label><p id="availabilityNote" class="drivers-note"></p><button id="saveAvailability" type="submit" class="drivers-primary">Cập nhật trạng thái làm việc</button></form><form id="profileForm"><div class="drivers-form-grid"><label>Họ tên *<input name="full_name" maxlength="150" required aria-describedby="error-full_name"><small id="error-full_name" class="drivers-field-error" aria-live="polite"></small></label><label>Điện thoại *<input name="phone" type="tel" maxlength="20" required aria-describedby="error-phone"><small id="error-phone" class="drivers-field-error" aria-live="polite"></small></label><label>Địa chỉ<input name="address" maxlength="255" aria-describedby="error-address"><small id="error-address" class="drivers-field-error" aria-live="polite"></small></label></div><div class="drivers-actions"><button id="saveProfile" type="submit" class="drivers-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Lưu thông tin</button></div></form></section></div></main></body></html>
