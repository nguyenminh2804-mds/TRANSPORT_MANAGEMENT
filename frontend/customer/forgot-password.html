<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quên mật khẩu - Quản lý vận tải</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <link
        rel="stylesheet"
        href="../css/common.css"
    >


    <link
        rel="stylesheet"
        href="../css/customer.css"
    >

</head>


<body>

<div class="customer-login-page">

    <div class="customer-login-card">


        <div class="customer-login-logo">

            <i class="fa-solid fa-key"></i>

        </div>


        <h1 class="customer-login-title">

            Quên mật khẩu

        </h1>


        <p class="customer-login-subtitle">

            Xác minh tài khoản để đặt lại mật khẩu

        </p>


        <form id="forgotPasswordForm">


            <!-- Username -->

            <div class="mb-3">

                <label
                    for="username"
                    class="customer-login-label"
                >

                    <i class="fa-solid fa-user me-1 text-primary"></i>

                    Tên đăng nhập

                </label>

                <input
                    type="text"
                    class="form-control customer-login-input"
                    id="username"
                    placeholder="Nhập tên đăng nhập"
                    required
                >

            </div>


            <!-- Full name -->

            <div class="mb-3">

                <label
                    for="fullName"
                    class="customer-login-label"
                >

                    <i class="fa-solid fa-id-card me-1 text-primary"></i>

                    Họ và tên

                </label>

                <input
                    type="text"
                    class="form-control customer-login-input"
                    id="fullName"
                    placeholder="Nhập họ và tên đã đăng ký"
                    required
                >

            </div>


            <!-- New password -->

            <div class="mb-3">

                <label
                    for="newPassword"
                    class="customer-login-label"
                >

                    <i class="fa-solid fa-lock me-1 text-primary"></i>

                    Mật khẩu mới

                </label>

                <input
                    type="password"
                    class="form-control customer-login-input"
                    id="newPassword"
                    placeholder="Ít nhất 6 ký tự"
                    required
                >

            </div>


            <!-- Confirm -->

            <div class="mb-3">

                <label
                    for="confirmPassword"
                    class="customer-login-label"
                >

                    <i class="fa-solid fa-lock me-1 text-primary"></i>

                    Xác nhận mật khẩu mới

                </label>

                <input
                    type="password"
                    class="form-control customer-login-input"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu mới"
                    required
                >

            </div>


            <div
                id="forgotMessage"
                class="mb-3"
            ></div>


            <button
                type="submit"
                class="btn customer-btn-primary w-100 py-2"
            >

                <i class="fa-solid fa-key me-2"></i>

                Đặt lại mật khẩu

            </button>


        </form>


        <div class="text-center mt-4">

            <a
                href="login.html"
                class="text-decoration-none"
            >

                <i class="fa-solid fa-arrow-left me-1"></i>

                Quay lại đăng nhập

            </a>

        </div>


    </div>

</div>


<script src="../js/forgot-password.js"></script>

</body>

</html>
