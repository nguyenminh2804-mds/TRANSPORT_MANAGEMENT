<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theo dõi đơn hàng - Quản lý vận tải</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        /* =========================
           NAVBAR
        ========================= */

        .topbar {
            height: 82px;
            background: linear-gradient(
                135deg,
                #1d4ed8,
                #2563eb
            );
            color: white;
            box-shadow:
                0 4px 15px rgba(37, 99, 235, 0.2);
        }

        .topbar-inner {
            max-width: 1280px;
            height: 100%;
            margin: auto;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;

            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: 700;
        }

        .brand i {
            font-size: 28px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.18);

            font-size: 18px;
        }

        #welcomeUser {
            font-size: 15px;
            font-weight: 600;
        }

        .logout-btn {
            height: 42px;
            padding: 0 17px;

            border: none;
            border-radius: 8px;

            background: white;
            color: #172033;

            font-weight: 600;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: #f1f5f9;
        }


        /* =========================
           MAIN
        ========================= */

        .page {
            max-width: 1280px;
            margin: auto;
            padding: 55px 25px;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h1 {
            margin: 0 0 8px;

            font-size: 34px;
            font-weight: 750;
        }

        .page-title p {
            margin: 0;

            color: #718096;
            font-size: 16px;
        }


        /* =========================
           SEARCH CARD
        ========================= */

        .search-card {
            overflow: hidden;

            background: white;

            border: 1px solid #e2e8f0;
            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(31, 52, 89, 0.06);
        }

        .search-header {
            display: flex;
            align-items: center;
            gap: 16px;

            padding: 25px;

            border-bottom: 1px solid #edf0f5;
        }

        .search-icon {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            color: #2563eb;
            background: #edf4ff;

            font-size: 20px;
        }

        .search-header h2 {
            margin: 0 0 5px;

            font-size: 19px;
            font-weight: 700;
        }

        .search-header p {
            margin: 0;

            color: #718096;
            font-size: 14px;
        }

        .search-body {
            padding: 30px;
        }

        .search-form {
            display: flex;
            gap: 12px;
        }

        .input-box {
            position: relative;
            flex: 1;
        }

        .input-box i {
            position: absolute;

            left: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: #2563eb;
        }

        .input-box input {
            width: 100%;
            height: 52px;

            padding: 0 18px 0 48px;

            border: 1px solid #d8e1ef;
            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.1);
        }

        .search-btn {
            height: 52px;

            padding: 0 25px;

            border: none;
            border-radius: 10px;

            color: white;
            background: #2563eb;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           MESSAGE
        ========================= */

        #trackingMessage {
            margin-top: 15px;
        }

        .message {
            padding: 14px 17px;

            border-radius: 10px;

            font-size: 14px;
        }

        .message.error {
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .message.info {
            color: #1d4ed8;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }


        /* =========================
           RESULT
        ========================= */

        #trackingResult {
            margin-top: 25px;
        }

        .result-card {
            overflow: hidden;

            background: white;

            border: 1px solid #e2e8f0;
            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(31, 52, 89, 0.06);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 25px;

            background: #f8faff;

            border-bottom: 1px solid #edf0f5;
        }

        .result-label {
            display: block;

            margin-bottom: 5px;

            color: #8994a5;
            font-size: 13px;
        }

        .result-header h2 {
            margin: 0;

            font-size: 24px;
            font-weight: 750;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 13px;
            font-weight: 600;
        }

        .status.warning {
            color: #92400e;
            background: #fef3c7;
        }

        .status.info {
            color: #0369a1;
            background: #e0f2fe;
        }

        .status.primary {
            color: #1d4ed8;
            background: #dbeafe;
        }

        .status.success {
            color: #047857;
            background: #d1fae5;
        }

        .status.danger {
            color: #b91c1c;
            background: #fee2e2;
        }


        /* =========================
           INFO
        ========================= */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;

            padding: 22px 25px;

            border-bottom: 1px solid #edf0f5;
        }

        .info-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            color: #2563eb;
            background: #edf4ff;
        }

        .info-label {
            display: block;

            margin-bottom: 4px;

            color: #8994a5;
            font-size: 12px;
        }

        .info-value {
            display: block;

            color: #172033;

            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           TIMELINE
        ========================= */

        .timeline-area {
            padding: 28px;

            background: #fafbfe;
        }

        .timeline-area h3 {
            margin: 0 0 28px;

            font-size: 17px;
        }

        .timeline {
            display: flex;
            justify-content: space-between;

            position: relative;
        }

        .timeline-line {
            position: absolute;

            top: 20px;
            left: 8%;
            right: 8%;

            height: 3px;

            background: #e2e8f0;
        }

        .timeline-step {
            position: relative;
            z-index: 1;

            width: 20%;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;
        }

        .timeline-icon {
            width: 40px;
            height: 40px;

            margin: 0 auto 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #94a3b8;
            background: #e2e8f0;

            border: 3px solid white;
        }

        .timeline-step.active {
            color: #2563eb;
        }

        .timeline-step.active .timeline-icon {
            color: white;
            background: #2563eb;
        }


        /* =========================
           BACK
        ========================= */

        .back {
            margin-top: 25px;
        }

        .back a {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 16px;

            border: 1px solid #d8e1ef;
            border-radius: 9px;

            color: #2563eb;
            background: white;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }

        .back a:hover {
            background: #f5f8ff;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .topbar {
                height: auto;
                padding: 15px 0;
            }

            .topbar-inner {
                gap: 15px;
            }

            .user-area {
                gap: 7px;
            }

            #welcomeUser {
                display: none;
            }

            .page {
                padding: 35px 15px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .search-form {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .result-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .timeline {
                overflow-x: auto;
                gap: 20px;
            }

            .timeline-line {
                display: none;
            }

            .timeline-step {
                min-width: 100px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="topbar">

    <div class="topbar-inner">

        <a
            href="dashboard.html"
            class="brand"
        >

            <i class="fa-solid fa-truck-fast"></i>

            <span>
                Quản lý vận tải
            </span>

        </a>


        <div class="user-area">

            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <span id="welcomeUser">
                Nguyễn Văn Test
            </span>

            <button
                type="button"
                id="logoutBtn"
                class="logout-btn"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Đăng xuất

            </button>

        </div>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">


    <div class="page-title">

        <h1>
            Theo dõi đơn hàng
        </h1>

        <p>
            Kiểm tra trạng thái và thông tin vận chuyển của đơn hàng
        </p>

    </div>


    <!-- SEARCH -->

    <section class="search-card">

        <div class="search-header">

            <div class="search-icon">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>

            <div>

                <h2>
                    Tra cứu vận đơn
                </h2>

                <p>
                    Nhập mã đơn hàng để xem trạng thái
                </p>

            </div>

        </div>


        <div class="search-body">

            <form
                id="trackingForm"
                class="search-form"
            >

                <div class="input-box">

                    <i class="fa-solid fa-box"></i>

                    <input
                        type="text"
                        id="trackingCode"
                        placeholder="Nhập mã đơn hàng, ví dụ: DH001"
                        autocomplete="off"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="search-btn"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Tra cứu

                </button>

            </form>


            <div id="trackingMessage"></div>

        </div>

    </section>


    <!-- RESULT -->

    <section id="trackingResult"></section>


    <!-- BACK -->

    <div class="back">

        <a href="dashboard.html">

            <i class="fa-solid fa-arrow-left"></i>

            Quay lại Dashboard

        </a>

    </div>

</main>


<script>

const API_BASE_URL =
    'http://localhost:19160/TRANSPORT_MANAGEMENT/backend/public/index.php';


const trackingForm =
    document.getElementById('trackingForm');

const trackingCode =
    document.getElementById('trackingCode');

const trackingMessage =
    document.getElementById('trackingMessage');

const trackingResult =
    document.getElementById('trackingResult');

const welcomeUser =
    document.getElementById('welcomeUser');

const logoutBtn =
    document.getElementById('logoutBtn');


// =====================================================
// LOAD USER
// =====================================================

async function loadUser() {

    try {

        const response = await fetch(
            `${API_BASE_URL}?route=/api/me`,
            {
                method: 'GET',
                credentials: 'include'
            }
        );

        const result =
            await response.json();

        if (!result.success) {

            window.location.href =
                'login.html';

            return;
        }

        welcomeUser.textContent =
            result.data.full_name ||
            result.data.username;

    } catch (error) {

        console.error(
            'Load user error:',
            error
        );

    }
}


// =====================================================
// TRACK
// =====================================================

trackingForm.addEventListener(
    'submit',
    async function (event) {

        event.preventDefault();

        const code =
            trackingCode.value.trim();


        if (!code) {

            trackingMessage.innerHTML = `
                <div class="message error">
                    <i class="fa-solid fa-circle-xmark"></i>
                    Vui lòng nhập mã đơn hàng.
                </div>
            `;

            return;
        }


        trackingMessage.innerHTML = `
            <div class="message info">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Đang tra cứu đơn hàng...
            </div>
        `;

        trackingResult.innerHTML = '';


        try {

            const response = await fetch(
                `${API_BASE_URL}?route=/api/customer/orders/track`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    credentials: 'include',

                    body: JSON.stringify({
                        order_code: code
                    })
                }
            );


            const result =
                await response.json();


            console.log(
                'Tracking response:',
                result
            );


            if (!result.success) {

                trackingMessage.innerHTML = `
                    <div class="message error">
                        <i class="fa-solid fa-circle-xmark"></i>
                        ${result.message}
                    </div>
                `;

                return;
            }


            trackingMessage.innerHTML = '';

            renderResult(
                result.data
            );


        } catch (error) {

            console.error(
                'Tracking error:',
                error
            );


            trackingMessage.innerHTML = `
                <div class="message error">

                    <i class="fa-solid fa-circle-xmark"></i>

                    Không thể kết nối đến máy chủ.

                    <br>

                    <small>
                        ${error.message}
                    </small>

                </div>
            `;

        }

    }
);


// =====================================================
// RENDER RESULT
// =====================================================

function renderResult(order) {

    const status =
        getStatus(order.status);


    trackingResult.innerHTML = `

        <div class="result-card">


            <div class="result-header">

                <div>

                    <span class="result-label">
                        Mã đơn hàng
                    </span>

                    <h2>
                        ${order.order_code || '-'}
                    </h2>

                </div>


                <span class="status ${status.className}">

                    <i class="${status.icon}"></i>

                    ${status.label}

                </span>

            </div>


            <div class="info-grid">


                <div class="info-item">

                    <div class="info-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div>

                        <span class="info-label">
                            Địa chỉ lấy hàng
                        </span>

                        <span class="info-value">
                            ${order.pickup_address || '-'}
                        </span>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div>

                        <span class="info-label">
                            Địa chỉ giao hàng
                        </span>

                        <span class="info-value">
                            ${order.delivery_address || '-'}
                        </span>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        <i class="fa-solid fa-weight-hanging"></i>
                    </div>

                    <div>

                        <span class="info-label">
                            Khối lượng
                        </span>

                        <span class="info-value">
                            ${order.total_weight || 0} kg
                        </span>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        <i class="fa-solid fa-money-bill-wave"></i>
                    </div>

                    <div>

                        <span class="info-label">
                            Phí vận chuyển
                        </span>

                        <span class="info-value">
                            ${formatMoney(order.shipping_fee)}
                        </span>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        <i class="fa-solid fa-credit-card"></i>
                    </div>

                    <div>

                        <span class="info-label">
                            Thanh toán
                        </span>

                        <span class="info-value">
                            ${formatPayment(order.payment_status)}
                        </span>

                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        <i class="fa-solid fa-calendar"></i>
                    </div>

                    <div>

                        <span class="info-label">
                            Ngày tạo đơn
                        </span>

                        <span class="info-value">
                            ${formatDate(order.created_at)}
                        </span>

                    </div>

                </div>

            </div>


            <div class="timeline-area">

                <h3>

                    <i class="fa-solid fa-route"></i>

                    Hành trình đơn hàng

                </h3>


                <div class="timeline">

                    <div class="timeline-line"></div>

                    ${renderTimeline(order.status)}

                </div>

            </div>

        </div>

    `;
}


// =====================================================
// STATUS
// =====================================================

function getStatus(status) {

    const map = {

        PENDING: {
            label: 'Chờ xử lý',
            className: 'warning',
            icon: 'fa-solid fa-clock'
        },

        CONFIRMED: {
            label: 'Đã xác nhận',
            className: 'info',
            icon: 'fa-solid fa-circle-check'
        },

        PICKING_UP: {
            label: 'Đang lấy hàng',
            className: 'info',
            icon: 'fa-solid fa-box'
        },

        DELIVERING: {
            label: 'Đang giao hàng',
            className: 'primary',
            icon: 'fa-solid fa-truck'
        },

        DELIVERED: {
            label: 'Đã giao hàng',
            className: 'success',
            icon: 'fa-solid fa-check'
        },

        CANCELLED: {
            label: 'Đã hủy',
            className: 'danger',
            icon: 'fa-solid fa-xmark'
        }

    };


    return map[status] || {

        label:
            status || 'Không xác định',

        className:
            'info',

        icon:
            'fa-solid fa-circle-question'
    };

}


// =====================================================
// TIMELINE
// =====================================================

function renderTimeline(status) {

    const steps = [

        {
            key: 'PENDING',
            label: 'Chờ xử lý',
            icon: 'fa-clock'
        },

        {
            key: 'CONFIRMED',
            label: 'Đã xác nhận',
            icon: 'fa-circle-check'
        },

        {
            key: 'PICKING_UP',
            label: 'Đang lấy hàng',
            icon: 'fa-box'
        },

        {
            key: 'DELIVERING',
            label: 'Đang giao hàng',
            icon: 'fa-truck'
        },

        {
            key: 'DELIVERED',
            label: 'Đã giao hàng',
            icon: 'fa-house-circle-check'
        }

    ];


    const currentIndex = {

        PENDING: 0,

        CONFIRMED: 1,

        PICKING_UP: 2,

        DELIVERING: 3,

        DELIVERED: 4

    }[status];


    return steps.map(
        (step, index) => {

            const active =
                currentIndex !== undefined &&
                index <= currentIndex;


            return `

                <div class="
                    timeline-step
                    ${active ? 'active' : ''}
                ">

                    <div class="timeline-icon">

                        <i class="
                            fa-solid
                            ${step.icon}
                        "></i>

                    </div>

                    <span>
                        ${step.label}
                    </span>

                </div>

            `;

        }
    ).join('');

}


// =====================================================
// PAYMENT
// =====================================================

function formatPayment(status) {

    const map = {

        PAID: 'Đã thanh toán',

        UNPAID: 'Chưa thanh toán',

        PENDING: 'Chờ thanh toán'

    };

    return map[status] || status || '-';

}


// =====================================================
// MONEY
// =====================================================

function formatMoney(value) {

    return Number(
        value || 0
    ).toLocaleString(
        'vi-VN'
    ) + ' VNĐ';

}


// =====================================================
// DATE
// =====================================================

function formatDate(value) {

    if (!value) {
        return '-';
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return value;
    }

    return date.toLocaleDateString(
        'vi-VN'
    );

}


// =====================================================
// LOGOUT
// =====================================================

logoutBtn.addEventListener(
    'click',
    async function () {

        try {

            await fetch(
                `${API_BASE_URL}?route=/api/logout`,
                {
                    method: 'POST',
                    credentials: 'include'
                }
            );

        } catch (error) {

            console.error(error);

        }

        window.location.href =
            'login.html';

    }
);


// =====================================================
// INIT
// =====================================================

loadUser();

</script>

</body>
</html>
