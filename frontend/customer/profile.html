<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thông tin cá nhân - Quản lý vận tải</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/common.css"
    >

    <link
        rel="stylesheet"
        href="../css/customer.css"
    >

</head>


<body class="customer-page">


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="customer-navbar">

    <div class="container d-flex justify-content-between align-items-center">


        <!-- Brand -->

        <div class="customer-brand">

            <i class="fa-solid fa-truck-fast"></i>

            <span>
                Quản lý vận tải
            </span>

        </div>


        <!-- User -->

        <div class="customer-user">

            <div class="customer-avatar">

                <i class="fa-solid fa-user"></i>

            </div>

            <span id="welcomeUser">
                Xin chào
            </span>

            <button
                type="button"
                id="logoutBtn"
                class="btn btn-light customer-logout"
            >

                <i
                    class="fa-solid fa-right-from-bracket me-2"
                ></i>

                Đăng xuất

            </button>

        </div>

    </div>

</nav>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container py-5">


    <!-- Page title -->

    <div class="customer-page-title mb-4">

        <h1>
            Thông tin cá nhân
        </h1>

        <p>
            Xem thông tin tài khoản và thông tin liên hệ của bạn
        </p>

    </div>


    <!-- =====================================================
         PROFILE CARD
    ====================================================== -->

    <section class="customer-profile-card">


        <!-- Header -->

        <div class="customer-profile-header">

            <div class="customer-profile-avatar">

                <i class="fa-solid fa-user"></i>

            </div>


            <div>

                <h2 id="profileName">
                    Đang tải...
                </h2>

                <p id="profileUsername">
                    Tài khoản
                </p>

            </div>


            <div class="customer-profile-status">

                <i class="fa-solid fa-circle-check"></i>

                <span>
                    Đang hoạt động
                </span>

            </div>

        </div>


        <!-- Information -->

        <div class="customer-profile-body">


            <!-- Full name -->

            <div class="customer-profile-item">

                <div class="customer-profile-icon">

                    <i class="fa-solid fa-user"></i>

                </div>

                <div>

                    <span>
                        Họ và tên
                    </span>

                    <strong id="profileFullName">
                        -
                    </strong>

                </div>

            </div>


            <!-- Phone -->

            <div class="customer-profile-item">

                <div class="customer-profile-icon">

                    <i class="fa-solid fa-phone"></i>

                </div>

                <div>

                    <span>
                        Số điện thoại
                    </span>

                    <strong id="profilePhone">
                        -
                    </strong>

                </div>

            </div>


            <!-- Email -->

            <div class="customer-profile-item">

                <div class="customer-profile-icon">

                    <i class="fa-solid fa-envelope"></i>

                </div>

                <div>

                    <span>
                        Email
                    </span>

                    <strong id="profileEmail">
                        -
                    </strong>

                </div>

            </div>


            <!-- Address -->

            <div class="customer-profile-item">

                <div class="customer-profile-icon">

                    <i class="fa-solid fa-location-dot"></i>

                </div>

                <div>

                    <span>
                        Địa chỉ
                    </span>

                    <strong id="profileAddress">
                        -
                    </strong>

                </div>

            </div>


        </div>


        <!-- Footer -->

        <div class="customer-profile-footer">

            <a
                href="dashboard.html"
                class="customer-profile-back"
            >

                <i class="fa-solid fa-arrow-left me-2"></i>

                Quay lại trang chủ

            </a>

        </div>

    </section>


</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

// Customer pages are located in frontend/customer/; resolve relative to the page.
async function customerRequest(route, options = {}) {
    const url = new URL('../../backend/public/index.php', window.location.href);
    url.searchParams.set('route', route);
    let response;
    try {
        response = await fetch(url.href, { ...options, credentials: 'same-origin', cache: 'no-store' });
    } catch {
        customerApiError('Không thể kết nối tới máy chủ. Hãy kiểm tra Apache/XAMPP rồi thử lại.');
        throw new Error('Customer API connection failed');
    }
    if (response.status === 401) {
        window.location.href = 'login.html';
        throw new Error('Session expired');
    }
    let result;
    try { result = await response.json(); }
    catch {
        customerApiError(`Máy chủ trả HTTP ${response.status} nhưng JSON không hợp lệ.`);
        throw new Error('Invalid customer API JSON');
    }
    if (!response.ok || !result || typeof result.success !== 'boolean' || !result.success) {
        customerApiError(`Yêu cầu thất bại (HTTP ${response.status}). ${response.status < 500 && typeof result?.message === 'string' ? result.message : 'Vui lòng thử lại sau.'}`);
        throw new Error('Customer API request failed');
    }
    return { ...response, json: async () => result };
}

function customerApiError(message) {
    let banner = document.getElementById('customerApiError');
    if (!banner) {
        banner = document.createElement('div');
        banner.id = 'customerApiError';
        banner.className = 'alert alert-danger m-3';
        banner.setAttribute('role', 'alert');
        document.body.prepend(banner);
    }
    banner.textContent = message;
}



document.addEventListener(
    'DOMContentLoaded',
    () => {

        loadProfile();

        setupLogout();

    }
);


/*
|--------------------------------------------------------------------------
| Load profile
|--------------------------------------------------------------------------
*/

async function loadProfile() {

    try {

        const response = await customerRequest('/api/customer/profile',
            {
                method: 'GET',
                credentials: 'same-origin'
            }
        );


        const result =
            await response.json();


        /*
        |--------------------------------------------------------------------------
        | Not logged in
        |--------------------------------------------------------------------------
        */

        if (!result.success) {
            customerApiError('Không thể tải phiên đăng nhập.');

            return;
        }


        const customer =
            result.data;


        /*
        |--------------------------------------------------------------------------
        | Navbar
        |--------------------------------------------------------------------------
        */

        const welcomeUser =
            document.getElementById(
                'welcomeUser'
            );


        if (welcomeUser) {

            welcomeUser.textContent =
                `Xin chào, ${customer.name || customer.full_name}`;

        }


        /*
        |--------------------------------------------------------------------------
        | Profile information
        |--------------------------------------------------------------------------
        */

        document.getElementById(
            'profileName'
        ).textContent =
            customer.name || '-';


        document.getElementById(
            'profileUsername'
        ).textContent =
            `Tài khoản: ${customer.username || '-'}`;


        document.getElementById(
            'profileFullName'
        ).textContent =
            customer.name || '-';


        document.getElementById(
            'profilePhone'
        ).textContent =
            customer.phone || '-';


        document.getElementById(
            'profileEmail'
        ).textContent =
            customer.email || '-';


        document.getElementById(
            'profileAddress'
        ).textContent =
            customer.address || '-';


    } catch (error) {

        console.error(
            'Load profile error:',
            error
        );

        alert(
            'Không thể tải thông tin khách hàng'
        );

    }

}


/*
|--------------------------------------------------------------------------
| Logout
|--------------------------------------------------------------------------
*/

function setupLogout() {

    const logoutBtn =
        document.getElementById(
            'logoutBtn'
        );


    logoutBtn.addEventListener(
        'click',
        async () => {

            try {

                const response =
                    await customerRequest('/api/logout',
                        {
                            method: 'POST',
                            credentials: 'same-origin'
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    window.location.href =
                        'login.html';

                } else {

                    alert(
                        result.message ||
                        'Đăng xuất thất bại'
                    );

                }

            } catch (error) {

                console.error(
                    'Logout error:',
                    error
                );

                alert(
                    'Không thể kết nối đến máy chủ'
                );

            }

        }
    );

}

</script>


</body>

</html>
