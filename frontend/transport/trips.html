<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Chuyến Vận Chuyển</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
        .card { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input, select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #4361ee; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Tạo Chuyến Vận Chuyển Mới</h3>
        <form id="createTripForm">
            <div class="form-group">
                <input type="number" id="driverId" placeholder="ID Tài xế (VD: 1)" required>
                <input type="number" id="vehicleId" placeholder="ID Xe (VD: 1)" required>
            </div>
            <div class="form-group">
                <input type="text" id="startLocation" placeholder="Điểm xuất phát" required>
                <input type="text" id="endLocation" placeholder="Điểm đến" required>
            </div>
            <button type="submit">Tạo Chuyến</button>
            <span id="msg" style="color: green; margin-left: 10px;"></span>
        </form>
    </div>

    <div class="card" id="trackingCard" style="display: none; border-left: 4px solid #05cd99;">
        <h3>Chi Tiết Theo Dõi (TRIP-<span id="trackId"></span>)</h3>
        <p><strong>Trạng thái:</strong> <span id="trackStatus"></span></p>
        <p><strong>Tài xế:</strong> <span id="trackDriver"></span> - SĐT: <span id="trackPhone"></span></p>
        <p><strong>Xe:</strong> <span id="trackVehicle"></span> | <strong>Lộ trình:</strong> <span id="trackRoute"></span></p>
        <button onclick="document.getElementById('trackingCard').style.display='none'" style="background: #e63946;">Đóng</button>
    </div>

    <div class="card">
        <h3>Danh sách Chuyến xe</h3>
        <table>
            <thead>
                <tr>
                    <th>Mã Chuyến</th>
                    <th>Tài xế</th>
                    <th>Biển số xe</th>
                    <th>Lộ trình</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="tripTableBody"></tbody>
        </table>
    </div>
    
    <script src="../js/trips.js"></script>
</body>
</html>
